name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/node

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set Matrix
        id: set-matrix
        run: |
          echo "matrix=$(jq -c . versions.json)" >> $GITHUB_OUTPUT

  build:
    needs: matrix-setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags
        id: tags
        run: |
          NODE="${{ matrix.version.node }}"
          LATEST="${{ matrix.version.latest }}"
          LTS="${{ matrix.version.lts }}"
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          if [ -z "$NODE" ]; then
            echo "ERROR: matrix.node evaluated to empty!"
            exit 1
          fi

          TAG_LIST="${REPO}:${NODE}"

          if [ "$LATEST" = "true" ]; then
            TAG_LIST="${TAG_LIST},${REPO}:latest"
          fi

          if [ "$LTS" = "true" ]; then
            TAG_LIST="${TAG_LIST},${REPO}:lts"
          fi

          echo "tags=${TAG_LIST}" >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            NODE_VERSION=${{ matrix.version.node }}
            ALPINE_VERSION=${{ matrix.version.alpine }}
            LATEST=${{ matrix.version.latest }}
          platforms: linux/amd64, linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
